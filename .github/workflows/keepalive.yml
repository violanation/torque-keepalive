name: Torque KeepAlive

on:
  schedule:
    - cron: '17 */6 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Check Supabase Projects
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Torque Beta
        env:
          SUPABASE_URL: ${{ secrets.BETA_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.BETA_SUPABASE_KEY }}
        run: |
          set -euo pipefail

          echo "Checking Torque Beta..."

          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 10 \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/app_health?select=id,status&id=eq.1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Cache-Control: no-cache")

          echo "$response" | jq -e \
            'type == "array" and length == 1 and .[0].id == 1 and .[0].status == "active"'

          echo "Torque Beta: HEALTHY"

      - name: Check Torque Staging
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.STAGING_SUPABASE_KEY }}
        run: |
          set -euo pipefail

          echo "Checking Torque Staging..."

          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --connect-timeout 10 \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/app_health?select=id,status&id=eq.1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Cache-Control: no-cache")

          echo "$response" | jq -e \
            'type == "array" and length == 1 and .[0].id == 1 and .[0].status == "active"'

          echo "Torque Staging: HEALTHY"
